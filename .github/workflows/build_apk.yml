name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Re-create Android Platform Files
        run: flutter create . --platforms=android

      - name: Fix compileSdk to 36
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle || true

      - name: Create Missing Assets Directories
        run: |
          mkdir -p assets/data assets/images assets/audio

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
