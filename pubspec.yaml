name: raed_altarikh
description: "رائد التاريخ - تطبيق تعليمي للطالب والمعلم في مادة التاريخ"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # إدارة الحالة
  provider: ^6.1.2

  # تخزين محلي
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # عرض PDF (الكتاب المدرسي)
  flutter_pdfview: ^1.3.2

  # تحويل النص إلى صوت
  flutter_tts: ^4.0.2

  # فحص الاتصال بالإنترنت (لتبديل وضع الذكاء الاصطناعي)
  connectivity_plus: ^6.0.3

  # خطوط عربية واضحة
  google_fonts: ^6.2.1

  # تنسيق التاريخ والوقت لسجل التحليل
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/audio/

  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
